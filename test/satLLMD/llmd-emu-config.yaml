model: llama-3.1-70b       # served model name (string)
block_size: 16             # cache block size in tokens (int)
time_scale: 1.0            # >1 = faster than real time (reported timings stay simulated)
default_output_tokens: 1000
# vocabulary: [hello, world, ...]   # answers are random words from this list (a built-in one is used if omitted)
vocabulary_file: llmd_emu/data/google-10000-english.txt   # public word list (one word per line); overrides `vocabulary`. Relative to this file
seed: 42                          # make the generated answers reproducible

# ---------------------------------------------------------------------------------------------------------------
# Emulated deployment: Llama-3.1-70B in FP16/BF16 on 4x NVIDIA A100 80GB (tensor parallel 4), one pod per worker.
# Everything below comes from architecture and datasheet values, NOT from measurements. Ideal roofline: efficiency
# factors are 1 and overheads are 0, so the resulting latencies are lower bounds. Calibrate before trusting them.
# ---------------------------------------------------------------------------------------------------------------
llm:                       # architecture (informational: the step coefficients below are derived from it)
  params: 70.6e9           # P
  active_params: 70.6e9    # dense model: all parameters are used per token
  bytes_per_param: 2       # FP16/BF16 -> W = P*2 = 141.2 GB
  n_layers: 80
  n_kv_heads: 8            # GQA
  head_dim: 128
  kv_bytes_per_elem: 2
  # KV_bytes_per_token k = 2 (K and V) *n_layers*n_kv_heads*head_dim*kv_bytes = 327680 B
hardware:                  # per GPU (informational)
  name: A100-80GB-SXM
  hbm_bandwidth_Bps: 2.039e12    # datasheet
  peak_flops: 312e12             # datasheet, dense FP16/BF16 tensor cores
  hbm_capacity_bytes: 80e9
  tp: 4                          # tensor parallelism , 4*80 GB = 320 GB: 141.2 GB of weights do not fit on 2 GPUs with room for KV

worker:                     # one process per pod does prefill + decode (no P/D separation, no KV transfer)
  # replicas: 2               # used only by python -m llmd_emu cluster
  slots: 8                  # concurrent sequences per worker (max-num-seqs)
  kv_cache_blocks: 28000    # = (0.9*tp*hbm_capacity_bytes - W) / (block_size*KV_bytes_per_token). 0.9 = vLLM-style memory utilization;
                            #   upper bound: activations and CUDA graphs are not subtracted
  register_interval_s: 5.0  # heartbeat: re-register with the router this often, so a dropped worker rejoins

step:                      # T_step = max(base_s, compute_per_token_s*(n_d + c)) + per_kv_token_s*sum(L_i)
                           #          + overhead_s
                           # n_d decoding sequences (1 token each), c prefill tokens in the step, L_i context of every running sequence
  max_batched_tokens: 2048   # token budget per step (decode tokens + prefill chunk). Typical chunked-prefill value,
                             #   a config choice: set it to your engine's. Must be >= worker.slots. null = unlimited
  base_s: 0.017312           # s0 = W/(tp*BW_HBM) = 141.2e9 / (4*2.039e12): streaming the weights once per step
  compute_per_token_s: 1.1314e-4   # s_c = 2*P/(tp*peak_flops) = 141.2e9 / (4*312e12): matmul compute per token, same
                             #   for decode and prefill tokens. It exceeds base_s only above s0/s_c = 153 tokens per step
  per_kv_token_s: 4.0177e-8  # s_kv = k/(tp*BW_HBM) = 327680 / (4*2.039e12): KV read per cached token (attention)
  overhead_s: 0.0327         # t_ov = T1_ref - base_s = 0.050 - 0.017312: kernel launch + TP all-reduce per step, added
                             #   outside the max. NOT measured: set so a single decoding sequence takes T1 = 50 ms, the
                             #   midpoint of the 40-60 ms inter-token latency listed for 70B on A100 TP=4 in
                             #   llm-d-inference-sim docs/latency-profiles.md.
trace:
  step_log: false           # true: record (sim_time, n_decode, n_prefill, prefill_tokens, ctx_sum, step_s) per step

router:
  policy: prefix-aware     # prefix-aware | least-load | round-robin
  prefix_weight: 3.0       # score += prefix_weight * cached_blocks / prompt_blocks  (0..1, as llm-d's prefix-cache scorer)
  load_weight: 2.0         # score -= load_weight * inflight / slots
  warmup_requests: 32      # prefix-aware: the first N picks go to a random worker (spreads the system prompt); 0 = off
  refresh_interval_s: 1.0  # period of the worker-load refresh; between refreshes picks increment inflight
  max_refresh_failures: 3   # consecutive failed refreshes (e.g. over a lossy ISL path) before a worker is dropped